name: Test shop access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Inspect public shop
        run: |
          python - <<'PY'
          import asyncio, json, pathlib
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(locale='ja-JP')
                  await page.goto('https://jp.mercari.com/shops/profile/oYdwrfnkLVvhfuMy3EqB6o', wait_until='domcontentloaded', timeout=60000)
                  try:
                      await page.locator('a[href*="/shops/product/"]').first.wait_for(timeout=60000)
                  except Exception:
                      pass
                  text = await page.locator('body').inner_text()
                  links = await page.locator('a[href*="/shops/product/"]').evaluate_all('(els) => els.map(e => ({href:e.href,text:e.innerText,aria:e.getAttribute("aria-label")}))')
                  print('Product count:', len(links))
                  print(json.dumps(links[:10], ensure_ascii=False))
                  print(text[:10000])
                  pathlib.Path('probe').mkdir(exist_ok=True)
                  await page.screenshot(path='probe/shop.png', full_page=True)
                  pathlib.Path('probe/page.txt').write_text(text, encoding='utf-8')
                  await browser.close()
                  if not links:
                      raise RuntimeError('No products loaded. Monitoring is not enabled.')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-access-test
          path: probe/
          retention-days: 1
